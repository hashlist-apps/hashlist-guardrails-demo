<text x="28" y="30" class="mono" font-size="10" letter-spacing=".6" fill="#6F756F">HASHLIST / WHERE THE GUARDRAIL ACTS, INSIDE THE AGENT'S REASONING</text>
<text x="972" y="30" class="mono" text-anchor="end" font-size="10" letter-spacing=".6" fill="#6F756F">DEMO DATA. FICTIONAL ECU.</text>
<text x="28" y="64" class="mono" font-size="10" letter-spacing=".6" fill="#3C413C">WITHOUT GUARDRAILS</text>
<text x="28" y="252" class="mono" font-size="10" letter-spacing=".6" fill="#3C413C">WITH HASHLIST GUARDRAILS</text>
<g class="a1"><rect x="28" y="74" width="222" height="108" rx="6" fill="#E3E4DD" stroke="#C9CCC4" stroke-width="1"/><text x="42" y="98" class="mono" font-size="10" letter-spacing=".6" fill="#6F756F">1.1 MIN</text><text x="42" y="124" class="sans" font-size="15" fill="#151815">Reads the board's own</text><text x="42" y="144" class="sans" font-size="15" fill="#151815">test data 410 µs</text></g>
<g class="a2"><rect x="266" y="74" width="222" height="108" rx="6" fill="#E3E4DD" stroke="#C9CCC4" stroke-width="1"/><text x="280" y="98" class="mono" font-size="10" letter-spacing=".6" fill="#6F756F">1.5 MIN</text><text x="280" y="124" class="sans" font-size="15" fill="#151815">Reads datasheet:</text><text x="280" y="144" class="sans" font-size="15" fill="#151815">230 µs</text></g>
<g class="a3"><rect x="504" y="74" width="222" height="108" rx="6" fill="#E3E4DD" stroke="#C9CCC4" stroke-width="1"/><text x="518" y="98" class="mono" font-size="10" letter-spacing=".6" fill="#6F756F">4.7 MIN</text><text x="518" y="124" class="sans" font-size="15" fill="#151815">Checks 230 µs with a test</text><text x="518" y="144" class="sans" font-size="15" fill="#151815">that has 230 µs built in</text></g>
<g class="a4"><rect x="742" y="74" width="222" height="108" rx="6" fill="#F6E3DF" stroke="#BF3B2A" stroke-width="1.6"/><text x="756" y="98" class="mono" font-size="10" letter-spacing=".6" fill="#BF3B2A">11.8 MIN</text><text x="756" y="124" class="sans" font-size="15" fill="#BF3B2A" font-weight="600">Answers 230 µs.</text><text x="756" y="144" class="sans" font-size="15" fill="#BF3B2A" font-weight="600">Correct: 410 µs.</text></g>
<g class="a5"><rect x="28" y="262" width="222" height="108" rx="6" fill="#E3E4DD" stroke="#C9CCC4" stroke-width="1"/><text x="42" y="286" class="mono" font-size="10" letter-spacing=".6" fill="#6F756F">SAME START</text><text x="42" y="312" class="sans" font-size="15" fill="#151815">Reads the board's own</text><text x="42" y="332" class="sans" font-size="15" fill="#151815">test data 410 µs</text></g>
<g class="a6"><rect x="266" y="262" width="222" height="108" rx="6" fill="#151815" stroke="#151815" stroke-width="1"/><text x="280" y="286" class="mono" font-size="10" letter-spacing=".6" fill="#A3B2A9">RULES + ANSWERS</text><text x="280" y="312" class="sans" font-size="15" fill="#EDEDE7">Measured data on this</text><text x="280" y="332" class="sans" font-size="15" fill="#EDEDE7">board beats the datasheet</text></g>
<g class="a7"><rect x="504" y="262" width="222" height="108" rx="6" fill="#151815" stroke="#151815" stroke-width="1"/><text x="518" y="286" class="mono" font-size="10" letter-spacing=".6" fill="#A3B2A9">CHECKER.PY</text><text x="518" y="312" class="sans" font-size="15" fill="#EDEDE7">Rejects a test that only</text><text x="518" y="332" class="sans" font-size="15" fill="#EDEDE7">repeats the datasheet</text></g>
<g class="a8"><rect x="742" y="262" width="222" height="108" rx="6" fill="#E3EFE7" stroke="#3E6A52" stroke-width="1.6"/><text x="756" y="286" class="mono" font-size="10" letter-spacing=".6" fill="#3E6A52">ANSWER</text><text x="756" y="312" class="sans" font-size="15" fill="#151815" font-weight="600">Answers 410 µs, from</text><text x="756" y="332" class="sans" font-size="15" fill="#151815" font-weight="600">the board's test data</text></g>
<g class="a9"><line x1="496" y1="186" x2="496" y2="232" stroke="#BF3B2A" stroke-width="2"/><path d="M490 228 l6 10 l6 -10z" fill="#BF3B2A"/><text x="508" y="226" class="sans" font-size="13" fill="#BF3B2A" font-style="italic">The guardrail steps in while the agent reasons</text></g>
<g class="a10"><rect x="28" y="386" width="944" height="58" rx="6" fill="#151815"/><text x="44" y="409" class="mono" font-size="11" letter-spacing=".6" fill="#EDEDE7">DEMO RESULT: 8 MODELS x 3 ATTEMPTS, 24 OF 24 RIGHT WITH THE GUARDRAIL FILES</text><text x="44" y="429" class="mono" font-size="10" letter-spacing=".5" fill="#A3B2A9">HOW IT WORKS: agent reads rules.md, checks the golden answer database, verifies its own output</text></g>
