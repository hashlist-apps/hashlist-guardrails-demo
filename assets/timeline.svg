}96.25%{opacity:1.0;transform:translateY(0px)}99.167%{opacity:0;transform:translateY(4px)}}.a7{animation:a7 12000ms linear infinite}@keyframes a8{0.0%{opacity:0;transform:translateY(4px)}55.833%{opacity:0;transform:translateY(4px)}58.75%{opacity:1.0;transform:translateY(0px)}96.25%{opacity:1.0;transform:translateY(0px)}99.167%{opacity:0;transform:translateY(4px)}}.a8{animation:a8 12000ms linear infinite}@keyframes a9{0.0%{opacity:0}27.5%{opacity:0}30.417%{opacity:1.0}96.25%{opacity:1.0}99.167%{opacity:0}}.a9{animation:a9 12000ms linear infinite}@keyframes a10{0.0%{opacity:0}62.5%{opacity:0}65.417%{opacity:1.0}96.25%{opacity:1.0}99.167%{opacity:0}}.a10{animation:a10 12000ms linear infinite}@media (prefers-reduced-motion:reduce){[class^=a],[class*=" a"]{animation:none!important}}</style>
