<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-labelledby="t d">
<title id="t">Without and with guardrails, the PMIC settle time case (demo)</title>
<desc id="d">Top row: an agent reads board data of 410 us, then the datasheet 230 us, checks 230 us with a test that has 230 us built in, and answers 230 us, which is wrong. Bottom row: with guardrails the same start, then rules and golden answers, then the checker rejects the test, and the agent answers 410 us. Demo data, fictional project.</desc>
