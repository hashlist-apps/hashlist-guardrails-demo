1.0}45.833%{opacity:1.0}48.75%{opacity:0}100.0%{opacity:0}}.a12{animation:a12 12000ms linear infinite}@keyframes a13{0.0%{opacity:0}45.833%{opacity:0}48.75%{opacity:1.0}55.0%{opacity:1.0}57.917%{opacity:0}100.0%{opacity:0}}.a13{animation:a13 12000ms linear infinite}@keyframes a14{0.0%{opacity:0}55.0%{opacity:0}57.917%{opacity:1.0}64.167%{opacity:1.0}67.083%{opacity:0}100.0%{opacity:0}}.a14{animation:a14 12000ms linear infinite}@keyframes a15{0.0%{opacity:0}64.167%{opacity:0}67.083%{opacity:1.0}73.333%{opacity:1.0}76.25%{opacity:0}100.0%{opacity:0}}.a15{animation:a15 12000ms linear infinite}@keyframes a16{0.0%{opacity:0}73.333%{opacity:0}76.25%{opacity:1.0}82.5%{opacity:1.0}85.417%{opacity:0}100.0%{opacity:0}}.a16{animation:a16 12000ms linear infinite}@keyframes a17{0.0%{opacity:0}82.5%{opacity:0}85.417%{opacity:1.0}96.25%{opacity:1.0}99.167%{opacity:0}}.a17{animation:a17 12000ms linear infinite}@media (prefers-reduced-motion:reduce){[class^=a],[class*=" a"]{animation:none!important}}</style>
<rect width="900" height="870" rx="14" fill="#EDEDE7"/>
<text x="28" y="30" class="mono" font-size="10" letter-spacing=".6" fill="#6F756F">HASHLIST / THE LOOP: EACH FAILURE IS FIXED ONCE, THE FIX APPLIES ACROSS THE ORGANISATION</text>
