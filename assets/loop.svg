<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" role="img" aria-labelledby="t d">
<title id="t">The six step loop: guardrails grow with every failure (demo)</title>
<desc id="d">A ring of six steps: capture, reconstruct, evaluate, golden set, integrate, audit. A dot travels around the ring and each step fills as it passes. The counter in the centre grows from 1 to 10 fixed failures. Demo data.</desc>
