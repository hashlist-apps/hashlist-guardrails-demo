<text x="450.0" y="702.0" text-anchor="middle" class="mono" font-size="9" letter-spacing=".6" fill="#3E6A52">HASHLIST</text>
<text x="450.0" y="728.0" text-anchor="middle" class="sans" font-size="20" font-weight="600" fill="#151815">Golden set</text>
<text x="450.0" y="748.0" text-anchor="middle" class="sans" font-size="13" fill="#3C413C">The correct answer and</text>
